name: SICAP watcher

on:
  schedule:
    # Hourly in UTC; the gate below keeps only 08, 10 … 22 Bucharest time,
    # so it stays right through summer/winter time changes.
    - cron: "23 5-20 * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a test alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sicap-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip odd hours (Bucharest)
        id: gate
        run: |
          H=$(TZ=Europe/Bucharest date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ $((H % 2)) -eq 0 ] && [ "$H" -ge 8 ] && [ "$H" -le 22 ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Bucharest hour $H, not a check slot."
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - name: Check for new purchases
        if: steps.gate.outputs.run == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          WATCH_AUTHORITIES: ${{ vars.WATCH_AUTHORITIES }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
        run: python3 watcher/check.py

      - name: Save seen purchases
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "sicap-watcher"
          git config user.email "sicap-watcher@users.noreply.github.com"
          git add watcher/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seen purchases"
          git push
